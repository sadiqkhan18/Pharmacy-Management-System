<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Pharmacy Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f3f3f3;
        }

        .main-container {
            width: 95%;
            height: 92vh;
            background: #dfe8de;
            border-radius: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15), 0 5px 15px rgba(0,0,0,0.08);
        }

        .left-side {
            width: 65%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .left-side img {
            width: 100%;
            max-width: 850px;
            object-fit: contain;
        }

        .login-box {
            width: 420px;
            background: white;
            border-radius: 22px;
            padding: 40px;
            box-shadow: 0 18px 40px rgba(0,0,0,0.18), 0 8px 20px rgba(0,0,0,0.08);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 40px;
        }

        .logo-area img {
            width: 70px;
            height: 70px;
            object-fit: contain;
        }

        .logo-text {
            font-size: 34px;
            font-weight: 800;
            line-height: 1.1;
            color: #12394b;
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            margin-bottom: 10px;
            font-size: 16px;
            font-weight: 700;
            color: #222;
        }

        .input-group input {
            width: 100%;
            height: 55px;
            border: 1px solid #cfcfcf;
            border-radius: 10px;
            padding: 0 15px;
            font-size: 18px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #0d4f68;
            box-shadow: 0 0 10px rgba(13,79,104,0.25);
        }

        .forgot {
            text-align: right;
            margin-top: -8px;
            margin-bottom: 30px;
        }

        .forgot a {
            text-decoration: none;
            color: #12394b;
            font-size: 15px;
            font-weight: 700;
        }

        .forgot a:hover {
            color: #0d4f68;
        }

        .login-btn {
            width: 100%;
            height: 58px;
            border: none;
            border-radius: 12px;
            background: #0d4f68;
            color: white;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(13,79,104,0.35);
        }

        .login-btn:hover {
            background: #0a3b4d;
            transform: translateY(-2px);
        }

        /* Flash message styling */
        .alert {
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .alert-warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }
        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        @media (max-width: 1000px) {
            .main-container {
                flex-direction: column;
                height: auto;
                padding: 30px;
            }
            .left-side {
                width: 100%;
                margin-bottom: 20px;
            }
            .login-box {
                width: 100%;
                max-width: 450px;
            }
            .logo-text {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="left-side">
            <img src="{{ url_for('static', filename='images/pharmacy.png') }}" alt="Pharmacy Illustration">
        </div>

        <div class="login-box">
            <div class="logo-area">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo">
                <div class="logo-text">
                    SMART <br>
                    PHARMACY
                </div>
            </div>

            <!-- Flash messages (success, error, etc.) -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="Username" required autofocus>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Password" required>
                </div>
                <!-- Optional: "Forgot Password" - you can keep or remove -->
                <!-- <div class="forgot"><a href="#">Forgot Password?</a></div> -->
                <button type="submit" class="login-btn">Login</button>
            </form>
        </div>
    </div>
</body>
</html>
