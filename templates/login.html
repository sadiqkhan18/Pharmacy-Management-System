{% extends "layout.html" %}
{% block title %}Login{% endblock %}
{% block page_title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-header bg-primary text-white text-center"><h4><i class="fas fa-laptop-medicine"></i> Smart Pharmacy</h4><small>Inventory Management System</small></div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3"><label><i class="fas fa-user"></i> Username</label><input type="text" name="username" class="form-control" required autofocus></div>
                    <div class="mb-3"><label><i class="fas fa-lock"></i> Password</label><input type="password" name="password" class="form-control" required></div>
                    <button type="submit" class="btn btn-primary w-100"><i class="fas fa-sign-in-alt"></i> Login</button>
                </form>
            </div>
            <div class="card-footer text-muted text-center small"><i class="fas fa-key"></i> Demo: admin/admin123 | pharmacist/pharma123</div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}<script>document.querySelector('.sidebar')?.remove();document.querySelector('.col-md-10')?.classList.remove('col-md-10');document.querySelector('.col-md-10')?.classList.add('col-md-12');</script>{% endblock %}
